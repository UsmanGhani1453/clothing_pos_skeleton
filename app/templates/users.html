{% extends "base.html" %}
{% block title %}Users - Shop POS{% endblock %}
{% block content %}
<h1>Users</h1>

<div class="card">
  <h2>Add New User</h2>
  <form id="user-form">
    <div class="form-row">
      <label>Username
        <input type="text" id="new-username" required placeholder="e.g. ali">
      </label>
      <label>Password
        <input type="password" id="new-password" required placeholder="min 4 characters">
      </label>
      <label>Role
        <select id="new-role">
          <option value="cashier">Cashier</option>
          <option value="owner">Owner</option>
        </select>
      </label>
    </div>
    <button type="submit">Add User</button>
  </form>
  <p id="form-error" style="color:#dc2626; font-size:14px;"></p>
</div>

<div class="card">
  <h2>Existing Users</h2>
  <table>
    <thead><tr><th>Username</th><th>Role</th><th>Actions</th></tr></thead>
    <tbody id="user-table-body"></tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById('user-form');
const formError = document.getElementById('form-error');
const tableBody = document.getElementById('user-table-body');

async function loadUsers() {
  const res = await fetch('/api/auth/users');
  const users = await res.json();
  tableBody.innerHTML = '';
  users.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(u.username)}</td>
      <td style="text-transform:capitalize;">${escapeHtml(u.role)}</td>
      <td><button class="secondary delete-btn" style="padding:6px 10px; font-size:13px; background:#fee2e2; color:#dc2626;">Delete</button></td>
    `;
    tr.querySelector('.delete-btn').addEventListener('click', () => deleteUser(u.id, u.username));
    tableBody.appendChild(tr);
  });
}

async function deleteUser(id, username) {
  if (!confirm(`Delete user "${username}"?`)) return;
  const res = await fetch(`/api/auth/users/${id}`, { method: 'DELETE' });
  if (res.ok) {
    loadUsers();
  } else {
    const err = await res.json();
    alert(err.detail || 'Failed to delete user.');
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  formError.innerText = '';
  const payload = {
    username: document.getElementById('new-username').value.trim(),
    password: document.getElementById('new-password').value,
    role: document.getElementById('new-role').value,
  };
  if (payload.password.length < 4) {
    formError.innerText = 'Password must be at least 4 characters.';
    return;
  }
  const res = await fetch('/api/auth/users', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    const err = await res.json();
    formError.innerText = err.detail || 'Failed to create user.';
    return;
  }
  form.reset();
  loadUsers();
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.innerText = str;
  return div.innerHTML;
}

loadUsers();
</script>
{% endblock %}
